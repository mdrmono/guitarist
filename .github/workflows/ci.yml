name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 binaries are available on this LTS image, unlike 26.04.
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-15-intel
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and native installer tests
        run: python -m unittest -v
      - name: Python and shell syntax
        run: |
          python -m py_compile __init__.py core/*.py integration/*.py ui/*.py dev/*.py scripts/smoke_anki.py
          bash -n scripts/install_dev.sh scripts/build_addon.sh
      - name: Build add-on
        run: |
          scripts/build_addon.sh
          mkdir -p output/ci
          mv dist/*.ankiaddon output/ci/
      - name: Install Anki for macOS smoke test
        if: runner.os == 'macOS'
        run: python -m pip install 'aqt[qt6]==26.9.3'
      - name: Native macOS Anki smoke test
        if: runner.os == 'macOS'
        run: python scripts/smoke_anki.py --require-macos
      - name: Upload build and smoke-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            output/ci/
            output/playwright/anki-smoke/
          if-no-files-found: warn
          retention-days: 14
